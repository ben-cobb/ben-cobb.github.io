name: Build check (CI validation)

# Validates that the al-folio site builds in GitHub Actions on the real source.
# BUILD-ONLY: uploads the generated _site as a downloadable artifact. Does NOT
# deploy and does NOT change any GitHub Pages settings — safe on a feature branch.
#
# CI-specific handling:
#  - Gems install SERIALLY (--jobs 1): Bundler 2.6.9's parallel installer
#    deadlocks on this Gemfile ("No live threads left. Deadlock?").
#  - Gemfile.lock is resolved fresh on Linux: the committed lock was generated on
#    macOS, so its precompiled Linux gems (nokogiri/ffi) are treated as "yanked"
#    on the runner, forcing a broken source build. A fresh resolve uses the
#    correct precompiled Linux binaries. (Only affects the runner; the committed
#    lock is untouched.)

on:
  push:
    branches:
      - claude/website-repo-review-22acd4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          # bundler-cache intentionally NOT enabled: it runs `bundle install --jobs 4`,
          # whose parallel installer deadlocks here. We install serially below instead.

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Install gems (fresh Linux resolve; serial to avoid Bundler deadlock)
        run: |
          rm -f Gemfile.lock
          bundle install --jobs 1 --retry 3

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies (Jupyter notebooks)
        run: pip3 install --upgrade nbconvert

      - name: Build site 🔧
        run: |
          export JEKYLL_ENV=production
          bundle exec jekyll build --verbose --trace

      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js

      - name: Upload built site artifact ⬆️
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 7
