name: Build check (CI validation)

# Builds the al-folio site in CI (validation) and, on a fully green build,
# commits the Linux-resolved Gemfile.lock back to this branch so deploys use
# pinned, CI-compatible gem versions. The auto-commit uses [skip ci] and only
# runs when the lock actually changed, so it cannot loop.

on:
  push:
    branches:
      - claude/website-repo-review-22acd4
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Install gems (fresh Linux resolve; serial to avoid Bundler deadlock)
        run: |
          rm -f Gemfile.lock
          bundle install --jobs 1 --retry 3

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies (Jupyter notebooks)
        run: pip3 install --upgrade nbconvert

      - name: Build site 🔧
        run: |
          export JEKYLL_ENV=production
          bundle exec jekyll build --verbose --trace

      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js

      - name: Upload built site artifact ⬆️
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 7

      - name: Commit Linux-resolved Gemfile.lock
        if: success()
        run: |
          if ! git diff --quiet -- Gemfile.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Gemfile.lock
            git commit -m "Commit Linux-resolved Gemfile.lock [skip ci]"
            git push origin HEAD:refs/heads/claude/website-repo-review-22acd4
          else
            echo "Gemfile.lock unchanged; nothing to commit."
          fi
