name: Build check (CI validation)

# Validates that the al-folio site builds in GitHub Actions on the real source.
# BUILD-ONLY: uploads the generated _site as a downloadable artifact. Does NOT
# deploy and does NOT change any GitHub Pages settings — safe on a feature branch.
#
# Notes on the two CI-specific fixes:
#  - Gems are installed SERIALLY (--jobs 1): Bundler 2.6.9's parallel installer
#    deadlocks on this Gemfile ("No live threads left. Deadlock?").
#  - nokogiri is built against the system libxml2/libxslt (apt) to avoid a
#    fragile vendored source build that fails on mini_portile2 activation.

on:
  push:
    branches:
      - claude/website-repo-review-22acd4
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          # bundler-cache intentionally NOT enabled: it runs `bundle install --jobs 4`,
          # whose parallel installer deadlocks here. We install serially below instead.

      - name: Cache gems
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: gems-${{ runner.os }}-ruby3.3.5-${{ hashFiles('Gemfile.lock') }}
          restore-keys: |
            gems-${{ runner.os }}-ruby3.3.5-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick libxml2-dev libxslt1-dev pkg-config

      - name: Install gems (serial; nokogiri uses system libxml2)
        run: |
          gem install bundler -v 2.6.9
          bundle config set --local path vendor/bundle
          bundle config set --local build.nokogiri --use-system-libraries
          bundle install --jobs 1 --retry 3

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Python dependencies (Jupyter notebooks)
        run: pip3 install --upgrade nbconvert

      - name: Build site 🔧
        run: |
          export JEKYLL_ENV=production
          bundle exec jekyll build --verbose --trace

      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js

      - name: Upload built site artifact ⬆️
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 7
